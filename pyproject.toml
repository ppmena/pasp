[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "pasp"
version = "0.4.2"
authors = [
  { name="Jules", email="jules@example.com" },
]
description = "Portable Android Statistics Program - A lightweight, local statistical analysis tool for terminal."
readme = "README.md"
requires-python = ">=3.7"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = [
    "pandas",
    "numpy",
    "scipy",
    "rich",
]

[project.scripts]
pasp = "pasp.main:main"

[tool.setuptools.package-data]
pasp = ["examples/*.csv"]

[tool.setuptools.packages.find]
where = ["."]
include = ["pasp*"]

[tool.setuptools]
include-package-data = true
